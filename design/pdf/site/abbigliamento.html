<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=DM+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600;700&family=Bodoni+Moda:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="base.css"><script src="common.js"></script><title>Alana Beauty · Abbigliamento</title></head>
<body>
<div id="hdr"></div>
<div class="wrap">
  <div class="crumb" id="cr"></div>
  <div class="plp-h"><h1 class="H">Abbigliamento</h1><p>Abiti, top, pantaloni e capispalla selezionati ogni settimana. Scegli taglia e colore: vedi subito cosa è disponibile.</p></div>
  <div class="chips" id="chips"></div>
  <div class="plp">
    <aside class="fil">
      <div class="fg"><b>Taglia</b><div class="sizes"><span>XS</span><span class="on">S</span><span class="on">M</span><span>L</span><span>XL</span></div></div>
      <div class="fg"><b>Colore</b><div class="cols"><i style="background:#1C1C1C" class="on"></i><i style="background:#FFFFFF"></i><i style="background:#F4EFE6"></i><i style="background:#C8A983"></i><i style="background:#E5B9AE"></i><i style="background:#C42430"></i><i style="background:#5B1F45"></i><i style="background:#1E2A55"></i><i style="background:#6F8FB3"></i><i style="background:#F2C230"></i></div></div>
      <div class="fg"><b>Prezzo</b><div class="range"><i style="left:10%"></i><i style="left:70%"></i></div><div class="rlab"><span>€ 20</span><span>€ 80</span></div></div>
      <div class="fg"><b>Disponibilità</b><span class="chk"><i class="on" id="ck1"></i>Solo disponibili</span><span class="chk"><i></i>In promozione<em>4</em></span><span class="chk"><i></i>Novità<em>9</em></span></div>
    </aside>
    <div>
      <div class="tool"><span class="mfil" id="mf"></span><span class="act"><span class="tag">S, M ✕</span><span class="tag">Nero ✕</span><span class="tag">Solo disponibili ✕</span></span><span>48 prodotti</span><span class="sel"><span>Ordina:</span> In evidenza <i id="dn" style="width:18px;height:18px;display:block"></i></span></div>
      <div class="grid" id="g"></div>
      <div class="pager"><span class="on">1</span><span>2</span><span>3</span><span>4</span></div>
    </div>
  </div>
</div>
<div id="ftr"></div>
<script>
fill('hdr', header('abb'));
fill('cr', 'Home ' + ICON.chev + ' <b>Abbigliamento</b>');
fill('chips', [['','Tutto'],['abito-viola','Abiti'],['camicia-righe','Top e camicie'],['jeans','Pantaloni'],['trench','Giacche'],['poncho','Maglieria'],['tuta','Tute']].map(function(c,i){return '<span'+(i==0?' class="on"':'')+'>'+(c[0]?'<img src="'+IMG(c[0])+'" alt="">':'')+c[1]+'</span>';}).join('').replace('<span class="on">','<span class="on" style="padding-left:18px">'));
fill('mf', ICON.filter + 'Filtri · 3');
fill('ck1', ICON.check); fill('dn', ICON.down);
fill('g', cards(['abito-pizzo','trench','pantalone-righe','abito-rosso','camicia-righe','bomber','abito-floreale','jeans','top-nero','tuta','cappotto','felpa']));
fill('ftr', footer());
</script>
</body></html>
